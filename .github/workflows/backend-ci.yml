name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, validate, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/fixtradezone
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fixtradezone
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
      MONGODB_URI: mongodb://127.0.0.1:27017/fixtradezone
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      JWT_ACCESS_SECRET: ci-only-access-secret-000000000001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-00000000001

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify Prisma schema
        run: npm run prisma:validate

      - name: Apply backend formatting
        run: npm run format

      - name: Verify formatting on PR and main
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: git diff --exit-code -- .

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Block critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Commit formatting-only changes on feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          if git diff --quiet -- src test scripts; then
            echo "No backend formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test scripts
          git commit -m "style: apply backend formatting"
          git push
