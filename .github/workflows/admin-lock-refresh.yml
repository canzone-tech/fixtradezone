name: Admin Lock Refresh

on:
  push:
    branches:
      - feature/universal-ui-system
    paths:
      - admin/package.json
      - .github/workflows/admin-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Refresh exact admin lockfile
        working-directory: admin
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Apply non-breaking audit remediations
        working-directory: admin
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Verify critical advisory gate
        working-directory: admin
        run: npm audit --audit-level=critical

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/package.json admin/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "chore(admin): refresh patched dependency lock"
            git push origin HEAD:feature/universal-ui-system
          fi
