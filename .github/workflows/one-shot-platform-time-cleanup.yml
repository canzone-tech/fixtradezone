name: One-shot platform time cleanup

on:
  push:
    branches:
      - feature/rewards-caps-lifecycle-foundation
    paths:
      - .github/workflows/one-shot-platform-time-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-shot-platform-time-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/rewards-caps-lifecycle-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Apply exact platform-time fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          packages = "admin/src/app/packages/packages-client.tsx"
          replace_exact(
              packages,
              'import { usePlatformTime } from "@/components/platform/platform-time-provider";\n',
              'import { usePlatformTime } from "@/components/platform/platform-time-provider";\nimport { formatPlatformDateTime } from "@/lib/platform-time";\n',
          )
          replace_exact(
              packages,
              '''function formatDate(value: string | null): string {\n  if (!value) {\n    return "Not set";\n  }\n\n  return new Intl.DateTimeFormat(undefined, {\n    dateStyle: "medium",\n    timeStyle: "short",\n    timeZone: "UTC",\n  }).format(new Date(value));\n}\n''',
              '''function formatDate(value: string | null): string {\n  return value ? formatPlatformDateTime(value) : "Not set";\n}\n''',
          )

          dashboard = "admin/src/app/user/dashboard/user-dashboard-client.tsx"
          replace_exact(
              dashboard,
              'import UserShell from "@/components/user/user-shell";\n',
              'import UserShell from "@/components/user/user-shell";\nimport { formatPlatformDateTime } from "@/lib/platform-time";\n',
          )
          replace_exact(
              dashboard,
              '''function formatDate(value: string | null): string {\n  if (!value) {\n    return "No login recorded";\n  }\n\n  return new Date(value).toLocaleString();\n}\n''',
              '''function formatDate(value: string | null): string {\n  return value ? formatPlatformDateTime(value) : "No login recorded";\n}\n''',
          )

          users = "admin/src/app/users/users-client.tsx"
          replace_exact(
              users,
              'import type { AdminUser } from "@/lib/auth";\n',
              'import type { AdminUser } from "@/lib/auth";\nimport { formatPlatformDate } from "@/lib/platform-time";\n',
          )
          replace_exact(
              users,
              '{new Date(user.createdAt).toLocaleDateString()}',
              '{formatPlatformDate(user.createdAt)}',
          )
          PY

      - name: Install Admin dependencies
        run: npm --prefix admin ci

      - name: Verify Admin portal
        run: npm --prefix admin run verify:local

      - name: Block critical dependency advisories
        run: npm --prefix admin audit --audit-level=critical

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit verified cleanup and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-platform-time-cleanup.yml
          git add admin/src/app/packages/packages-client.tsx \
                  admin/src/app/user/dashboard/user-dashboard-client.tsx \
                  admin/src/app/users/users-client.tsx
          if git diff --cached --quiet; then
            echo "No verified cleanup changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): finish platform timezone migration"
          git push origin HEAD:feature/rewards-caps-lifecycle-foundation
