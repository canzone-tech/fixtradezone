name: Branch Lint Repair

on:
  push:
    branches:
      - fix/user-access-and-subscription-history

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: run branch lint repair' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Replace unsafe Jest matcher assignment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/auth/auth.service.spec.ts')
          text = path.read_text()
          old = """  it('revokes a device-bound refresh session when presented from another device', async () => {\n    prepareRefreshSession();\n"""
          new = """  it('revokes a device-bound refresh session when presented from another device', async () => {\n    const revokedAt = new Date('2026-08-19T06:00:00.000Z');\n    jest.useFakeTimers().setSystemTime(revokedAt);\n    prepareRefreshSession();\n"""
          if old not in text:
              raise SystemExit('Unable to locate mismatch refresh test header')
          text = text.replace(old, new, 1)

          old = """      data: expect.objectContaining({\n        revocationReason: 'SESSION_DEVICE_MISMATCH',\n      }),\n"""
          new = """      data: {\n        revokedAt,\n        revocationReason: 'SESSION_DEVICE_MISMATCH',\n      },\n"""
          if old not in text:
              raise SystemExit('Unable to locate unsafe mismatch assertion')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format affected backend files
        working-directory: backend
        run: |
          npx prettier --write \
            src/auth/auth.service.spec.ts \
            src/auth/auth.service.ts \
            src/duplicate-account/dto/upsert-user-device-policy.dto.ts \
            src/duplicate-account/duplicate-account.service.ts

      - name: Verify backend lint
        working-directory: backend
        run: npm run lint

      - name: Verify targeted auth tests
        working-directory: backend
        run: npm test -- --runInBand src/duplicate-account/duplicate-account.service.spec.ts src/auth/auth.service.spec.ts src/auth/auth.service.monitor.spec.ts

      - name: Verify backend build
        working-directory: backend
        run: npm run build

      - name: Commit verified lint repair
        run: |
          if git diff --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/src/auth/auth.service.spec.ts \
            backend/src/auth/auth.service.ts \
            backend/src/duplicate-account/dto/upsert-user-device-policy.dto.ts \
            backend/src/duplicate-account/duplicate-account.service.ts
          git commit -m 'chore: fix backend lint after auth hardening'
          git push origin HEAD:${GITHUB_REF_NAME}
