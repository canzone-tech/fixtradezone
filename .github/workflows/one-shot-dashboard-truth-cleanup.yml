name: One-shot dashboard truth cleanup

on:
  push:
    branches:
      - feature/rewards-caps-lifecycle-foundation
    paths:
      - .github/workflows/one-shot-dashboard-truth-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-shot-dashboard-truth-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/rewards-caps-lifecycle-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Apply exact dashboard truth fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin/src/app/user/dashboard/user-dashboard-client.tsx')
          text = path.read_text()

          def replace_exact(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_exact(
              '''    label: "Package",\n    value: "AWAITING API",\n    detail: "Module pending",''',
              '''    label: "Package",\n    value: "LIVE",\n    detail: "Packages workspace",''',
          )
          replace_exact(
              '''    label: "Wallet",\n    value: "AWAITING API",\n    detail: "Module pending",''',
              '''    label: "Wallet",\n    value: "LIVE",\n    detail: "Ledger-backed wallet",''',
          )
          replace_exact(
              '''                  <small>My Package</small>\n                  <strong>—</strong>\n                  <span>Awaiting live Packages API</span>''',
              '''                  <small>My Package</small>\n                  <strong>LIVE</strong>\n                  <span>Open My Packages for exact lifecycle state</span>''',
          )
          replace_exact(
              '''                  <small>Wallet Balance</small>\n                  <strong>—</strong>\n                  <span>Awaiting live Wallet API</span>''',
              '''                  <small>Wallet</small>\n                  <strong>LIVE</strong>\n                  <span>Exact per-currency balances are ledger-backed</span>''',
          )
          replace_exact(
              '''                  <small>Total Deposits</small>\n                  <strong>—</strong>\n                  <span>Awaiting live Deposit API</span>''',
              '''                  <small>Deposits</small>\n                  <strong>LIVE</strong>\n                  <span>Open Deposits for payment and review status</span>''',
          )
          replace_exact(
              '''                  <span className={styles.pendingBadge}>LIVE API PENDING</span>''',
              '''                  <span className={styles.pendingBadge}>DEDICATED LIVE WORKSPACES</span>''',
          )
          replace_exact(
              '''                    Financial totals and chart points will appear only after\n                    their production APIs are connected.''',
              '''                    Exact financial totals remain in the dedicated live Wallet,\n                    Deposits, Packages and Referrals workspaces to avoid unsafe\n                    cross-currency aggregation on this overview.''',
          )
          replace_exact(
              '''                    <small>Total Deposits</small>\n                    <strong>—</strong>\n                    <span>Awaiting API</span>''',
              '''                    <small>Deposits</small>\n                    <strong>LIVE</strong>\n                    <span>Dedicated deposit workspace</span>''',
          )
          replace_exact(
              '''                    <small>Referral Earnings</small>\n                    <strong>—</strong>\n                    <span>Commission module pending</span>''',
              '''                    <small>Referral Earnings</small>\n                    <strong>LIVE</strong>\n                    <span>Ledger-backed wallet bucket</span>''',
          )
          replace_exact(
              '''                      <strong>Wallet module pending</strong>\n                      <p>\n                        Deposit account, transaction and balance data will\n                        connect here through the Wallet module.\n                      </p>''',
              '''                      <strong>Deposits and Wallet are live</strong>\n                      <p>\n                        Use the dedicated workspaces for exact payment status,\n                        immutable ledger activity and per-currency balances.\n                      </p>''',
          )
          replace_exact(
              '''                      <small>Current Package</small>\n                      <strong>—</strong>\n                      <span>Awaiting Packages API</span>''',
              '''                      <small>Current Package</small>\n                      <strong>LIVE</strong>\n                      <span>Open My Packages for exact active packages</span>''',
          )
          replace_exact(
              '''                      <small>Package Workspace</small>\n                      <strong>Production module pending</strong>\n                      <span>No package value is being fabricated</span>''',
              '''                      <small>Package Workspace</small>\n                      <strong>Lifecycle API live</strong>\n                      <span>No package value is fabricated on the overview</span>''',
          )
          replace_exact(
              '''                <span className={styles.pendingBadge}>LIVE DATA PENDING</span>''',
              '''                <span className={styles.pendingBadge}>WALLET HISTORY LIVE</span>''',
          )
          replace_exact(
              '''                            <strong>No transaction API connected yet</strong>\n                            <span>Real user transactions will appear here.</span>''',
              '''                            <strong>Open My Wallet for immutable history</strong>\n                            <span>Exact ledger activity stays in the ledger-backed wallet workspace.</span>''',
          )
          replace_exact(
              '''                  <small>Referral Earnings</small>\n                  <strong>—</strong>\n                  <span>Commission module pending</span>''',
              '''                  <small>Referral Earnings</small>\n                  <strong>LIVE</strong>\n                  <span>Ledger-backed wallet bucket</span>''',
          )
          replace_exact(
              '''                  Financial values remain unavailable until live APIs exist.\n                  Simulated activity will always be explicitly labelled as\n                  simulated.''',
              '''                  Exact financial values remain in dedicated ledger-backed\n                  workspaces and are never aggregated across currencies here.\n                  Simulated activity will always be explicitly labelled as simulated.''',
          )

          path.write_text(text)
          PY

      - name: Install Admin dependencies
        run: npm --prefix admin ci

      - name: Verify Admin portal
        run: npm --prefix admin run verify:local

      - name: Block critical dependency advisories
        run: npm --prefix admin audit --audit-level=critical

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit verified cleanup and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-dashboard-truth-cleanup.yml
          git add admin/src/app/user/dashboard/user-dashboard-client.tsx
          if git diff --cached --quiet; then
            echo "No verified dashboard cleanup changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): align user dashboard with live modules"
          git push origin HEAD:feature/rewards-caps-lifecycle-foundation
