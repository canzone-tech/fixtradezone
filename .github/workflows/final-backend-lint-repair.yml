name: Final Backend Lint Repair

on:
  push:
    branches:
      - fix/user-access-and-subscription-history

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://127.0.0.1:3306/fixtradezone_artifact
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Verify backend lint
        working-directory: backend
        run: npm run lint

      - name: Verify targeted auth tests
        working-directory: backend
        run: npm test -- --runInBand src/duplicate-account/duplicate-account.service.spec.ts src/auth/auth.service.spec.ts src/auth/auth.service.monitor.spec.ts

      - name: Verify backend build
        working-directory: backend
        run: npm run build

      - name: Remove temporary diagnostics and helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/final-backend-lint-output.txt
          git rm .github/workflows/final-backend-lint-repair.yml
          git commit -m 'chore: finalize backend lint repair'
          git push origin HEAD:${GITHUB_REF_NAME}
